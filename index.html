<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ZoeWar Scripts</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b0f;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: #121218;
      border: 1px solid #292933;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 0 30px rgba(0,0,0,.5);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    .description {
      text-align: center;
      color: #999;
      margin-bottom: 25px;
    }

    .code-box {
      background: #08080b;
      border: 1px solid #292933;
      border-radius: 12px;
      padding: 15px;
    }

    code {
      display: block;
      word-break: break-all;
      color: #ddd;
      font-family: monospace;
      font-size: 14px;
      line-height: 1.6;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: white;
      color: black;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>ZoeWar Scripts</h1>

    <div class="description">
      Script Hub
    </div>

    <div class="code-box">
      <code id="script">
SEU_CODIGO_AQUI
      </code>

      <button onclick="copyScript()">COPY</button>
    </div>
  </div>

  <script>
    function copyScript() {
      const text = document.getElementById("script").innerText.trim();

      navigator.clipboard.writeText(text).then(() => {
        const button = document.querySelector("button");

        button.innerText = "COPIED!";

        setTimeout(() => {
          button.innerText = "COPY";
        }, 1500);
      });
    }
  </script>

</body>
</html>
